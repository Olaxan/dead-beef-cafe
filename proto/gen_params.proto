syntax = "proto3";

package world;

message NamePool
{
	repeated string prefix = 1;
	repeated string suffix = 2;
}

enum BusinessType
{
	Manufacturing = 0;
	DigitalTechnology = 1;
	CyberSecurity = 2;
	Banking = 3;
	ResourceExtraction = 4;
}

message GenCountry
{
	string country_name = 1 [json_name = "countryName"];
	
	BusinessType primary_business = 2 [json_name = "primaryBusiness"];

	optional NamePool person_names = 3 [json_name = "personNames"];
	optional NamePool business_names = 4 [json_name = "businessNames"];
	optional NamePool isp_names = 5 [json_name = "ispNames"];
}

message GenModule
{
	string module_name = 1 [json_name = "moduleName"];
	optional uint32 min_instances = 2 [json_name = "minInstances"];
	optional uint32 max_instances = 3 [json_name = "maxInstances"];
	optional uint32 min_hosts = 4 [json_name = "minHosts"];
	optional uint32 max_hosts = 5 [json_name = "maxHosts"];
	optional NamePool name_pool = 6 [json_name = "namePool"];
	repeated GenModule children = 7;
}

message GenParams
{
	repeated GenCountry countries = 1;
	repeated GenModule modules = 2;
}