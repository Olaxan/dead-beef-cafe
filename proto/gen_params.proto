syntax = "proto3";

package world;

message NamePool
{
	repeated string prefix = 1;
	repeated string suffix = 2;
}

enum BusinessType
{
	Manufacturing = 0;
	DigitalTechnology = 1;
	CyberSecurity = 2;
	Banking = 3;
	ResourceExtraction = 4;
}

message GenCountry
{
	string country_name = 1 [json_name = "countryName"];
	
	BusinessType primary_business = 2 [json_name = "primaryBusiness"];

	repeated NamePool person_names = 3 [json_name = "personNames"];
	repeated NamePool business_names = 4 [json_name = "businessNames"];
}

message GenParams
{
	repeated GenCountry countries = 1;
}